<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bookBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>
    <linearGradient id="cardGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
  </defs>

  <!-- App Window Background -->
  <rect width="800" height="500" fill="url(#bookBg)" rx="12"/>

  <!-- Window Header Bar -->
  <rect width="800" height="48" fill="#111827" rx="12"/>
  <rect y="36" width="800" height="12" fill="#111827"/>
  <!-- Window dots -->
  <circle cx="28" cy="24" r="6" fill="#ef4444"/>
  <circle cx="48" cy="24" r="6" fill="#f59e0b"/>
  <circle cx="68" cy="24" r="6" fill="#10b981"/>
  <!-- URL bar -->
  <rect x="120" y="12" width="400" height="24" rx="12" fill="#1f2937"/>
  <text x="140" y="28" fill="#9ca3af" font-family="'Outfit', system-ui, sans-serif" font-size="12">https://harshika.dev/bookstore-app</text>

  <!-- Navigation Bar Inside App -->
  <rect y="48" width="800" height="54" fill="#1e293b" opacity="0.9"/>
  <circle cx="45" cy="75" r="14" fill="#f59e0b"/>
  <path d="M40 70 L50 70 L50 80 L40 80 Z" fill="#ffffff" opacity="0.9"/>
  <text x="70" y="80" fill="#ffffff" font-family="'Outfit', system-ui, sans-serif" font-size="16" font-weight="700">LiteraRealm Bookstore</text>
  <!-- Search input -->
  <rect x="340" y="60" width="280" height="30" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="355" y="80" fill="#64748b" font-family="'Outfit', system-ui, sans-serif" font-size="12">Search titles, authors, genres...</text>
  <!-- Cart badge -->
  <rect x="710" y="60" width="60" height="30" rx="6" fill="#f59e0b"/>
  <text x="725" y="80" fill="#111827" font-family="'Outfit', system-ui, sans-serif" font-size="12" font-weight="700">Cart (3)</text>

  <!-- Hero Banner inside Mockup -->
  <rect x="30" y="120" width="740" height="110" rx="10" fill="#132338" stroke="#1e3a5f" stroke-width="1"/>
  <text x="60" y="160" fill="#f8fafc" font-family="'Outfit', system-ui, sans-serif" font-size="20" font-weight="700">Curated Bookshelf &amp; Reading Sanctuary</text>
  <text x="60" y="185" fill="#94a3b8" font-family="'Outfit', system-ui, sans-serif" font-size="13">Explore timeless classics, CS fundamentals, and literature curated with care.</text>
  <rect x="60" y="198" width="100" height="22" rx="4" fill="#0d9488"/>
  <text x="72" y="213" fill="#ffffff" font-family="'Outfit', system-ui, sans-serif" font-size="11" font-weight="600">Featured Picks</text>

  <!-- Book Showcase Grid -->
  <!-- Book 1 -->
  <g transform="translate(40, 250)">
    <rect width="160" height="220" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <rect x="15" y="15" width="130" height="130" rx="6" fill="url(#cardGrad1)"/>
    <text x="25" y="70" fill="#ffffff" font-family="'Outfit', system-ui, sans-serif" font-size="13" font-weight="700">The Art of</text>
    <text x="25" y="90" fill="#ffffff" font-family="'Outfit', system-ui, sans-serif" font-size="15" font-weight="800">Algorithms</text>
    <text x="15" y="165" fill="#f8fafc" font-family="'Outfit', system-ui, sans-serif" font-size="12" font-weight="600">Clean Code Guide</text>
    <text x="15" y="182" fill="#f59e0b" font-family="'Outfit', system-ui, sans-serif" font-size="12" font-weight="700">₹499</text>
    <rect x="100" y="168" width="45" height="20" rx="4" fill="#f59e0b"/>
    <text x="110" y="182" fill="#111827" font-family="'Outfit', system-ui, sans-serif" font-size="10" font-weight="700">Add</text>
  </g>

  <!-- Book 2 -->
  <g transform="translate(230, 250)">
    <rect width="160" height="220" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <rect x="15" y="15" width="130" height="130" rx="6" fill="url(#cardGrad2)"/>
    <text x="25" y="70" fill="#ffffff" font-family="'Outfit', system-ui, sans-serif" font-size="13" font-weight="700">Systems</text>
    <text x="25" y="90" fill="#ffffff" font-family="'Outfit', system-ui, sans-serif" font-size="15" font-weight="800">Architect</text>
    <text x="15" y="165" fill="#f8fafc" font-family="'Outfit', system-ui, sans-serif" font-size="12" font-weight="600">Database Mastery</text>
    <text x="15" y="182" fill="#14b8a6" font-family="'Outfit', system-ui, sans-serif" font-size="12" font-weight="700">₹599</text>
    <rect x="100" y="168" width="45" height="20" rx="4" fill="#14b8a6"/>
    <text x="110" y="182" fill="#111827" font-family="'Outfit', system-ui, sans-serif" font-size="10" font-weight="700">Add</text>
  </g>

  <!-- Book 3 -->
  <g transform="translate(420, 250)">
    <rect width="160" height="220" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <rect x="15" y="15" width="130" height="130" rx="6" fill="url(#cardGrad3)"/>
    <text x="25" y="70" fill="#ffffff" font-family="'Outfit', system-ui, sans-serif" font-size="13" font-weight="700">Poetry of</text>
    <text x="25" y="90" fill="#ffffff" font-family="'Outfit', system-ui, sans-serif" font-size="15" font-weight="800">Punjab</text>
    <text x="15" y="165" fill="#f8fafc" font-family="'Outfit', system-ui, sans-serif" font-size="12" font-weight="600">Folk &amp; Heritage</text>
    <text x="15" y="182" fill="#fb7185" font-family="'Outfit', system-ui, sans-serif" font-size="12" font-weight="700">₹349</text>
    <rect x="100" y="168" width="45" height="20" rx="4" fill="#fb7185"/>
    <text x="110" y="182" fill="#ffffff" font-family="'Outfit', system-ui, sans-serif" font-size="10" font-weight="700">Add</text>
  </g>

  <!-- Book 4 -->
  <g transform="translate(610, 250)">
    <rect width="160" height="220" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <rect x="15" y="15" width="130" height="130" rx="6" fill="url(#cardGrad4)"/>
    <text x="25" y="70" fill="#ffffff" font-family="'Outfit', system-ui, sans-serif" font-size="13" font-weight="700">Modern Web</text>
    <text x="25" y="90" fill="#ffffff" font-family="'Outfit', system-ui, sans-serif" font-size="15" font-weight="800">Crafting</text>
    <text x="15" y="165" fill="#f8fafc" font-family="'Outfit', system-ui, sans-serif" font-size="12" font-weight="600">Frontend Patterns</text>
    <text x="15" y="182" fill="#818cf8" font-family="'Outfit', system-ui, sans-serif" font-size="12" font-weight="700">₹649</text>
    <rect x="100" y="168" width="45" height="20" rx="4" fill="#6366f1"/>
    <text x="110" y="182" fill="#ffffff" font-family="'Outfit', system-ui, sans-serif" font-size="10" font-weight="700">Add</text>
  </g>

  <!-- Notice Banner Overlay -->
  <g transform="translate(520, 12)">
    <rect width="260" height="24" rx="4" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1"/>
    <text x="10" y="16" fill="#fef3c7" font-family="'Outfit', system-ui, sans-serif" font-size="10">Swap with your real screenshot anytime</text>
  </g>
</svg>
