    <text x="210" y="65" fill="#f59e0b" font-family="'Outfit', system-ui, sans-serif" font-size="12" font-weight="700">45%</text>
    <rect x="20" y="73" width="220" height="8" rx="4" fill="#334155"/>
    <rect x="20" y="73" width="99" height="8" rx="4" fill="#f59e0b"/>

    <text x="20" y="110" fill="#94a3b8" font-family="'Outfit', system-ui, sans-serif" font-size="12">Python / Data Analytics</text>
    <text x="210" y="110" fill="#38bdf8" font-family="'Outfit', system-ui, sans-serif" font-size="12" font-weight="700">30%</text>
    <rect x="20" y="118" width="220" height="8" rx="4" fill="#334155"/>
    <rect x="20" y="118" width="66" height="8" rx="4" fill="#38bdf8"/>

    <text x="20" y="155" fill="#94a3b8" font-family="'Outfit', system-ui, sans-serif" font-size="12">C++ / Algorithms</text>
    <text x="210" y="155" fill="#14b8a6" font-family="'Outfit', system-ui, sans-serif" font-size="12" font-weight="700">25%</text>
    <rect x="20" y="163" width="220" height="8" rx="4" fill="#334155"/>
    <rect x="20" y="163" width="55" height="8" rx="4" fill="#14b8a6"/>

    <!-- Heatmap teaser -->
    <text x="20" y="195" fill="#94a3b8" font-family="'Outfit', system-ui, sans-serif" font-size="11">COMMIT HEATMAP</text>
    <g transform="translate(20, 204)">
      <!-- 7 columns of 3 squares -->
      <rect x="0" y="0" width="10" height="10" rx="2" fill="#0e4429"/>
      <rect x="0" y="13" width="10" height="10" rx="2" fill="#006d32"/>
      <rect x="0" y="26" width="10" height="10" rx="2" fill="#26a641"/>

      <rect x="14" y="0" width="10" height="10" rx="2" fill="#39d353"/>
      <rect x="14" y="13" width="10" height="10" rx="2" fill="#006d32"/>
      <rect x="14" y="26" width="10" height="10" rx="2" fill="#0e4429"/>

      <rect x="28" y="0" width="10" height="10" rx="2" fill="#006d32"/>
      <rect x="28" y="13" width="10" height="10" rx="2" fill="#39d353"/>
      <rect x="28" y="26" width="10" height="10" rx="2" fill="#26a641"/>

      <rect x="42" y="0" width="10" height="10" rx="2" fill="#26a641"/>
      <rect x="42" y="13" width="10" height="10" rx="2" fill="#39d353"/>
      <rect x="42" y="26" width="10" height="10" rx="2" fill="#39d353"/>

      <rect x="56" y="0" width="10" height="10" rx="2" fill="#006d32"/>
      <rect x="56" y="13" width="10" height="10" rx="2" fill="#26a641"/>
      <rect x="56" y="26" width="10" height="10" rx="2" fill="#0e4429"/>

      <rect x="70" y="0" width="10" height="10" rx="2" fill="#39d353"/>
      <rect x="70" y="13" width="10" height="10" rx="2" fill="#26a641"/>
      <rect x="70" y="26" width="10" height="10" rx="2" fill="#39d353"/>

      <text x="95" y="22" fill="#14b8a6" font-family="'Outfit', system-ui, sans-serif" font-size="11">Consistent daily rhythm</text>
