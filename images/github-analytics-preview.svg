<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="gitBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="chartLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="chartAreaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#gitBg)" rx="12"/>

  <!-- Window Header -->
  <rect width="800" height="48" fill="#111827" rx="12"/>
  <rect y="36" width="800" height="12" fill="#111827"/>
  <circle cx="28" cy="24" r="6" fill="#ef4444"/>
  <circle cx="48" cy="24" r="6" fill="#f59e0b"/>
  <circle cx="68" cy="24" r="6" fill="#10b981"/>
  <rect x="120" y="12" width="380" height="24" rx="12" fill="#1f2937"/>
  <text x="140" y="28" fill="#9ca3af" font-family="'Outfit', system-ui, sans-serif" font-size="12">https://harshika.dev/github-analytics</text>

  <!-- GitHub App Header -->
  <g transform="translate(30, 65)">
    <!-- GitHub Octocat stylized logo -->
    <circle cx="20" cy="20" r="18" fill="#f8fafc"/>
    <path d="M20 6 C12.27 6 6 12.27 6 20 C6 26.19 10.01 31.43 15.58 33.28 C16.28 33.41 16.53 32.98 16.53 32.61 C16.53 32.28 16.52 31.2 16.51 29.84 C12.62 30.68 11.8 28.16 11.8 28.16 C11.16 26.54 10.24 26.11 10.24 26.11 C8.97 25.24 10.34 25.26 10.34 25.26 C11.75 25.36 12.49 26.71 12.49 26.71 C13.74 28.85 15.77 28.23 16.57 27.87 C16.7 26.96 17.06 26.34 17.46 25.99 C14.35 25.64 11.08 24.44 11.08 19.08 C11.08 17.55 11.63 16.3 12.52 15.32 C12.38 14.97 11.9 13.55 12.66 11.64 C12.66 11.64 13.84 11.26 16.51 13.07 C17.63 12.76 18.82 12.6 20.01 12.6 C21.19 12.6 22.38 12.76 23.51 13.07 C26.18 11.26 27.35 11.64 27.35 11.64 C28.12 13.55 27.64 14.97 27.5 15.32 C28.4 16.3 28.93 17.55 28.93 19.08 C28.93 24.46 25.65 25.63 22.53 25.98 C23.03 26.41 23.47 27.26 23.47 28.56 C23.47 30.43 23.45 31.94 23.45 32.41 C23.45 32.79 23.7 33.22 24.42 33.08 C29.98 31.22 34 25.99 34 19.8 C34 12.27 27.73 6 20 6 Z" fill="#0f172a"/>
    <text x="50" y="24" fill="#ffffff" font-family="'Outfit', system-ui, sans-serif" font-size="18" font-weight="700">GitHub Developer Intelligence</text>
    <text x="50" y="40" fill="#94a3b8" font-family="'Outfit', system-ui, sans-serif" font-size="12">Repository Analytics &amp; Velocity Dashboard</text>
  </g>

  <!-- Metric Quick Cards -->
  <g transform="translate(30, 130)">
    <rect width="170" height="75" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="16" y="28" fill="#94a3b8" font-family="'Outfit', system-ui, sans-serif" font-size="11">TOTAL COMMITS</text>
    <text x="16" y="56" fill="#14b8a6" font-family="'Outfit', system-ui, sans-serif" font-size="22" font-weight="800">1,482</text>
    <text x="85" y="56" fill="#10b981" font-family="'Outfit', system-ui, sans-serif" font-size="12">↑ +24%</text>

    <rect x="190" width="170" height="75" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="206" y="28" fill="#94a3b8" font-family="'Outfit', system-ui, sans-serif" font-size="11">ACTIVE REPOS</text>
    <text x="206" y="56" fill="#f59e0b" font-family="'Outfit', system-ui, sans-serif" font-size="22" font-weight="800">18</text>
    <text x="245" y="56" fill="#94a3b8" font-family="'Outfit', system-ui, sans-serif" font-size="12">public</text>

    <rect x="380" width="170" height="75" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="396" y="28" fill="#94a3b8" font-family="'Outfit', system-ui, sans-serif" font-size="11">CODE REVIEWS</text>
    <text x="396" y="56" fill="#38bdf8" font-family="'Outfit', system-ui, sans-serif" font-size="22" font-weight="800">94</text>
    <text x="435" y="56" fill="#38bdf8" font-family="'Outfit', system-ui, sans-serif" font-size="12">PRs merged</text>

    <rect x="570" width="170" height="75" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="586" y="28" fill="#94a3b8" font-family="'Outfit', system-ui, sans-serif" font-size="11">LONGEST STREAK</text>
    <text x="586" y="56" fill="#f43f5e" font-family="'Outfit', system-ui, sans-serif" font-size="22" font-weight="800">42 Days</text>
  </g>

