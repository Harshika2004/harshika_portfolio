    <line x1="20" y1="80" x2="430" y2="80" stroke="#334155" stroke-dasharray="3 3"/>
    <line x1="20" y1="130" x2="430" y2="130" stroke="#334155" stroke-dasharray="3 3"/>
    <line x1="20" y1="180" x2="430" y2="180" stroke="#334155" stroke-dasharray="3 3"/>
    <!-- Area & Line Graph -->
    <path d="M30,190 Q90,140 140,160 T250,90 T350,110 T430,70 L430,210 L30,210 Z" fill="url(#chartAreaGrad)"/>
    <path d="M30,190 Q90,140 140,160 T250,90 T350,110 T430,70" fill="none" stroke="url(#chartLineGrad)" stroke-width="3"/>
    <circle cx="140" cy="160" r="4" fill="#14b8a6"/>
    <circle cx="250" cy="90" r="4" fill="#38bdf8"/>
    <circle cx="350" cy="110" r="4" fill="#f59e0b"/>
    <circle cx="430" cy="70" r="4" fill="#f43f5e"/>
    <text x="30" y="230" fill="#64748b" font-family="'Outfit', system-ui, sans-serif" font-size="11">Jan</text>
    <text x="130" y="230" fill="#64748b" font-family="'Outfit', system-ui, sans-serif" font-size="11">Apr</text>
    <text x="240" y="230" fill="#64748b" font-family="'Outfit', system-ui, sans-serif" font-size="11">Jul</text>
    <text x="340" y="230" fill="#64748b" font-family="'Outfit', system-ui, sans-serif" font-size="11">Oct</text>
    <text x="415" y="230" fill="#64748b" font-family="'Outfit', system-ui, sans-serif" font-size="11">Now</text>
  </g>

